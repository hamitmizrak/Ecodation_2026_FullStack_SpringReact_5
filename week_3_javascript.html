<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <!-- Türkçe karakter sorunu çözsün: üğşçöıÜĞŞÇÖİ -->
    <meta charset="UTF-8" />
    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BS5-Full stack developer-5</title>
    <link rel="icon" type="image/x-icon" href="./assets/image/favicon.png" />

    <meta name="author" content="MsC Hamit Mızrak" />
    <meta name="keywords" content="html5,css3,js, es5,es6,ts,node,bs5,react" />
    <meta name="description" content="Full stack developer nedir?" />

    <!-- external css -->
    <!-- <link rel="stylesheet" href="./assets/css/style.css" /> -->

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- internal css -->

    <style></style>
  </head>

  <body>
    <noscript>
      <!-- JavaScript devre dışı bırakılmışsa gösterilecek içerik -->
      <p>
        Bu site JavaScript gerektirir. Lütfen JavaScript'i etkinleştirin ve sayfayı yeniden
        yükleyin.
      </p>
    </noscript>
    <!--  Start Code -->

    <!-- main.form-card>div.text-center.mb-4>h2.form-title{Eğitim / Danışmanlık Başvuru Formu}+p.form-subtitle{Lütfen bilgilerinizi eksiksiz doldurunuz} -->
    <main class="form-card">
      <!-- Form -->
      <section id="form_id">
        <div class="text-center mb-4">
          <h2 class="form-title">Eğitim / Danışmanlık Başvuru Formu</h2>
          <p class="form-subtitle">Lütfen bilgilerinizi eksiksiz doldurunuz</p>
        </div>
      </section>

      <form action="#" method="get" id="applicationForm" novalidate>
        <!-- Name -->
        <div class="col-md-6">
          <label for="name" class="form-label">
            Ad
            <span class="required">*</span>
          </label>
          <input
            type="text"
            class="form-control"
            id="name"
            placeholder="Adınızı giriniz..."
            required
            title="Adınızı giriniz"
          />
        </div>

        <!-- Surname -->
        <div class="col-md-6">
          <label for="surname" class="form-label">
            Soyad
            <span class="required">*</span>
          </label>
          <input
            type="text"
            class="form-control"
            id="surname"
            placeholder="Soyadınızı giriniz..."
            required
            title="Soyadınızı giriniz"
          />
        </div>

        <!-- Email -->
        <div class="col-md-6">
          <label for="email" class="form-label">
            Email
            <span class="required">*</span>
          </label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="examples: hamitmizrak@gmail.com"
            required
            title="Emailinizi giriniz"
          />
          <div class="invalid-feedback">Geçerli bir email adresi giriniz.</div>
        </div>

        <!-- Phone -->
        <div class="col-md-6">
          <label for="phone" class="form-label">
            Telefon
            <span class="required">*</span>
          </label>
          <input
            type="tel"
            class="form-control"
            id="phone"
            placeholder="05xx xxx xx xx"
            required
            title="Telefon numaranızı giriniz"
          />
          <div class="invalid-feedback">Geçerli bir telefon numarası giriniz.</div>
        </div>
      </form>
    </main>

    <!--  End Code -->
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
